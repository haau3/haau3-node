name: Public text

# Everything this repository publishes says only what this repository shows: its files, the commit
# messages a pull request brings, and the pull request's title and description, which become the
# squash commit on main (scripts/check-public-text.ts). It runs again when the title or description
# is edited. Dependabot's title, description and commits quote other projects' release notes, so
# only the files are checked on its pull requests.

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: public-text-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Public text
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Files, commits, title and description
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$AUTHOR" = "dependabot[bot]" ]; then
            pnpm check:public-text
          else
            pnpm check:public-text --commits "$BASE..$HEAD" --text-env PR_TITLE --text-env PR_BODY
          fi
