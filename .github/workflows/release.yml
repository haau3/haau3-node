name: Release

# npm's trusted publisher for @haau3/sdk names this file and the `npm` environment, so neither is
# renamed. A version tag (v0.1.0) stages that version on npm, with provenance, for the owner to
# approve with 2FA (`npm stage approve <id>`, or the package's Staged tab on npmjs.com). No npm token
# exists anywhere: npm trusts this workflow through GitHub's OIDC token.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  stage:
    name: Stage the release on npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # Node 24's npm (11.19) can stage over OIDC, which needs npm 11.15 or newer; Node 22's cannot.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile
      - name: The tag names package.json's version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: The generated code matches the pinned spec
        run: pnpm generate && git diff --exit-code -- src/generated
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:package
      - name: Stage for approval
        run: npm stage publish --access public
